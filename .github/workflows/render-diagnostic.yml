name: Render diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: node tools/qa/profile-render.mjs
      - run: npx playwright test --project=mobile tests/e2e/performance.spec.ts tests/e2e/route-performance.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-diagnostic
          path: |
            docs/performance/render-diagnostic/
            test-results/
